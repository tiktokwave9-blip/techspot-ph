<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TechSpot PH — Admin</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px 6%;
  border-bottom: 1px solid #222;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: 800;
}

.blue {
  color: #1683ff;
}

main {
  padding: 40px 6%;
  max-width: 1200px;
  margin: auto;
}

.panel {
  background: #0d0d0d;
  border: 1px solid #252525;
  border-radius: 18px;
  padding: 25px;
  margin-bottom: 25px;
}

.login {
  max-width: 420px;
  margin: 100px auto;
}

h1,
h2 {
  margin-top: 0;
}

input,
textarea {
  width: 100%;
  background: #080808;
  border: 1px solid #333;
  color: white;
  border-radius: 10px;
  padding: 13px;
  font-size: 16px;
  outline: none;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

label {
  display: block;
  color: #aaa;
  margin-bottom: 7px;
}

.field {
  margin-bottom: 15px;
}

button {
  border: 0;
  cursor: pointer;
  border-radius: 10px;
  padding: 12px 18px;
  font-weight: 700;
}

.primary {
  background: #087ff5;
  color: white;
}

.secondary {
  background: #222;
  color: white;
}

.danger {
  background: #8b1e1e;
  color: white;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.full {
  grid-column: 1 / -1;
}

.products {
  display: grid;
  gap: 12px;
}

.product {
  background: #111;
  border: 1px solid #292929;
  border-radius: 14px;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
}

.product h3 {
  margin: 0 0 8px;
}

.product p {
  margin: 5px 0;
  color: #aaa;
}

.product img {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 12px;
  border: 1px solid #333;
}

.product-info {
  display: flex;
  gap: 15px;
  align-items: center;
}

.actions {
  display: flex;
  gap: 8px;
}

.message {
  color: #aaa;
  margin-top: 12px;
}

#dashboard {
  display: none;
}

.photo-box {
  background: #080808;
  border: 1px dashed #444;
  border-radius: 14px;
  padding: 15px;
  text-align: center;
}

.photo-preview {
  width: 180px;
  height: 180px;
  object-fit: cover;
  border-radius: 14px;
  border: 1px solid #333;
  display: none;
  margin: 15px auto;
}

.photo-button {
  display: inline-block;
  background: #087ff5;
  color: white;
  padding: 12px 18px;
  border-radius: 10px;
  font-weight: 700;
  cursor: pointer;
}

.photo-button input {
  display: none;
}

.photo-name {
  color: #888;
  font-size: 14px;
  margin-top: 10px;
}

@media (max-width: 700px) {

  main {
    padding: 25px 5%;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: auto;
  }

  .product {
    flex-direction: column;
    align-items: flex-start;
  }

  .product-info {
    width: 100%;
  }

  .actions {
    width: 100%;
  }

  .actions button {
    flex: 1;
  }
}
</style>

</head>

<body>

<header>

  <div class="logo">
    TECH<span class="blue">SPOT</span> PH — ADMIN
  </div>

  <button
    id="logoutButton"
    class="secondary"
    style="display:none"
    onclick="logout()"
  >
    LOG OUT
  </button>

</header>

<main>

<section id="login" class="panel login">

  <h1>Admin Login</h1>

  <p class="message">
    Enter your admin password.
  </p>

  <div class="field">

    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Admin password"
    >

  </div>

  <button
    class="primary"
    onclick="login()"
  >
    LOG IN
  </button>

  <p id="loginMessage" class="message"></p>

</section>


<section id="dashboard">

  <h1>Admin Dashboard</h1>

  <p class="message">
    Manage TechSpot PH products.
  </p>


  <section class="panel">

    <h2 id="formTitle">
      Add Product
    </h2>

    <input
      id="productId"
      type="hidden"
    >

    <div class="form-grid">

      <div class="field">

        <label>
          Product Name
        </label>

        <input
          id="name"
          type="text"
          placeholder="iPhone 13"
        >

      </div>


      <div class="field">

        <label>
          Price
        </label>

        <input
          id="price"
          type="number"
          min="0"
          step="0.01"
          placeholder="25000"
        >

      </div>


      <div class="field">

        <label>
          Rating
        </label>

        <input
          id="rating"
          type="number"
          min="0"
          max="5"
          step="0.1"
          placeholder="5"
        >

      </div>


      <div class="field">

        <label>
          Rating Count
        </label>

        <input
          id="ratingCount"
          type="number"
          min="0"
          placeholder="100"
        >

      </div>


      <div class="field">

        <label>
          Stock
        </label>

        <input
          id="stock"
          type="number"
          min="0"
          placeholder="10"
        >

      </div>


      <!-- ADD PHOTO -->

      <div class="field">

        <label>
          Product Photo
        </label>

        <div class="photo-box">

          <label class="photo-button">

            📷 ADD PHOTO

            <input
              id="photoInput"
              type="file"
              accept="image/*"
              onchange="handlePhoto(event)"
            >

          </label>

          <img
            id="photoPreview"
            class="photo-preview"
            alt="Product preview"
          >

          <div
            id="photoName"
            class="photo-name"
          >
            No photo selected
          </div>

        </div>

      </div>


      <div class="field full">

        <label>
          Description
        </label>

        <textarea
          id="description"
          placeholder="Product description..."
        ></textarea>

      </div>

    </div>


    <div class="actions">

      <button
        class="primary"
        onclick="saveProduct()"
      >
        SAVE PRODUCT
      </button>

      <button
        class="secondary"
        onclick="clearForm()"
      >
        CLEAR
      </button>

    </div>

  </section>


  <section class="panel">

    <h2>
      Products
    </h2>

    <div
      id="products"
      class="products"
    >
      Loading...
    </div>

  </section>

</section>

</main>


<script>

const API_URL = "/api/products";
const AUTH_URL = "/api/admin";

let products = [];
let selectedImageData = "";


/* =========================
   SESSION
========================= */

async function checkSession() {

  try {

    const response =
      await fetch(
        AUTH_URL,
        {
          credentials: "same-origin",
          cache: "no-store"
        }
      );

    const data =
      await response.json();

    if (data.authenticated) {
      showDashboard();
    } else {
      showLogin();
    }

  } catch {

    showLogin();

  }

}


function showLogin() {

  document.getElementById("login").style.display =
    "block";

  document.getElementById("dashboard").style.display =
    "none";

  document.getElementById("logoutButton").style.display =
    "none";

}


function showDashboard() {

  document.getElementById("login").style.display =
    "none";

  document.getElementById("dashboard").style.display =
    "block";

  document.getElementById("logoutButton").style.display =
    "block";

  loadProducts();

}


/* =========================
   LOGIN
========================= */

async function login() {

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");


  if (!password) {

    message.textContent =
      "Enter your password.";

    return;

  }


  message.textContent =
    "Logging in...";


  try {

    const response =
      await fetch(
        AUTH_URL,
        {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            password
          })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      message.textContent =
        data.error || "Login failed.";

      return;

    }


    document.getElementById("password").value =
      "";

    message.textContent =
      "";

    showDashboard();


  } catch {

    message.textContent =
      "Unable to connect to the server.";

  }

}


async function logout() {

  await fetch(
    AUTH_URL,
    {
      method: "DELETE",
      credentials: "same-origin"
    }
  );

  showLogin();

}


/* =========================
   PHOTO UPLOAD
========================= */

function handlePhoto(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }

  if (!file.type.startsWith("image/")) {

    alert("Please select an image.");

    event.target.value = "";

    return;
  }

  const maxSize =
    10 * 1024 * 1024;

  if (file.size > maxSize) {

    alert(
      "Image is too large. Please choose an image under 10MB."
    );

    event.target.value = "";

    return;
  }


  const reader =
    new FileReader();


  reader.onload = function(e) {

    const image =
      new Image();


    image.onload = function() {

      const maxWidth = 1000;
      const maxHeight = 1000;

      let width =
        image.width;

      let height =
        image.height;


      if (width > maxWidth) {

        height =
          height *
          (maxWidth / width);

        width =
          maxWidth;

      }


      if (height > maxHeight) {

        width =
          width *
          (maxHeight / height);

        height =
          maxHeight;

      }


      const canvas =
        document.createElement("canvas");

      canvas.width =
        Math.round(width);

      canvas.height =
        Math.round(height);


      const ctx =
        canvas.getContext("2d");


      ctx.drawImage(
        image,
        0,
        0,
        canvas.width,
        canvas.height
      );


      selectedImageData =
        canvas.toDataURL(
          "image/jpeg",
          0.75
        );


      const preview =
        document.getElementById(
          "photoPreview"
        );


      preview.src =
        selectedImageData;

      preview.style.display =
        "block";


      document.getElementById(
        "photoName"
      ).textContent =
        file.name;

    };


    image.src =
      e.target.result;

  };


  reader.readAsDataURL(file);

}


/* =========================
   PRODUCTS
========================= */

async function loadProducts() {

  try {

    const response =
      await fetch(
        API_URL,
        {
          credentials: "same-origin",
          cache: "no-store"
        }
      );


    if (!response.ok) {
      throw new Error();
    }


    products =
      await response.json();


    renderProducts();


  } catch {

    document.getElementById("products").innerHTML =
      "<p>Unable to load products.</p>";

  }

}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function renderProducts() {

  const container =
    document.getElementById("products");


  if (!products.length) {

    container.innerHTML =
      "<p>No products found.</p>";

    return;

  }


  container.innerHTML = "";


  products.forEach(product => {

    const item =
      document.createElement("div");

    item.className =
      "product";


    const image =
      product.image_url
        ? `<img src="${escapeHTML(product.image_url)}" alt="">`
        : "";


    item.innerHTML = `

      <div class="product-info">

        ${image}

        <div>

          <h3>
            ${escapeHTML(product.name)}
          </h3>

          <p>
            ₱${Number(product.price).toLocaleString()}
          </p>

          <p>
            ⭐ ${product.rating || 0}
            (${product.rating_count || 0})
            · Stock: ${product.stock || 0}
          </p>

        </div>

      </div>

      <div class="actions">

        <button
          class="primary"
          onclick="editProduct(${product.id})"
        >
          EDIT
        </button>

        <button
          class="danger"
          onclick="deleteProduct(${product.id})"
        >
          DELETE
        </button>

      </div>

    `;


    container.appendChild(item);

  });

}


/* =========================
   EDIT
========================= */

function editProduct(id) {

  const product =
    products.find(
      item =>
        Number(item.id) === Number(id)
    );


  if (!product) return;


  document.getElementById("productId").value =
    product.id;

  document.getElementById("name").value =
    product.name || "";

  document.getElementById("price").value =
    product.price || "";

  document.getElementById("rating").value =
    product.rating || "";

  document.getElementById("ratingCount").value =
    product.rating_count || "";

  document.getElementById("stock").value =
    product.stock || "";

  document.getElementById("description").value =
    product.description || "";


  selectedImageData =
    product.image_url || "";


  const preview =
    document.getElementById(
      "photoPreview"
    );


  const photoName =
    document.getElementById(
      "photoName"
    );


  if (product.image_url) {

    preview.src =
      product.image_url;

    preview.style.display =
      "block";

    photoName.textContent =
      "Current product photo";

  } else {

    preview.src =
      "";

    preview.style.display =
      "none";

    photoName.textContent =
      "No photo selected";

  }


  document.getElementById("formTitle").textContent =
    "Edit Product";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================
   CLEAR
========================= */

function clearForm() {

  document.getElementById("productId").value =
    "";

  document.getElementById("name").value =
    "";

  document.getElementById("price").value =
    "";

  document.getElementById("rating").value =
    "";

  document.getElementById("ratingCount").value =
    "";

  document.getElementById("stock").value =
    "";

  document.getElementById("description").value =
    "";


  document.getElementById("photoInput").value =
    "";


  selectedImageData =
    "";


  document.getElementById(
    "photoPreview"
  ).src = "";

  document.getElementById(
    "photoPreview"
  ).style.display = "none";


  document.getElementById(
    "photoName"
  ).textContent =
    "No photo selected";


  document.getElementById("formTitle").textContent =
    "Add Product";

}


/* =========================
   SAVE
========================= */

async function saveProduct() {

  const id =
    document.getElementById("productId").value;


  const data = {

    name:
      document.getElementById("name").value.trim(),

    price:
      Number(
        document.getElementById("price").value
      ),

    description:
      document.getElementById("description").value.trim(),

    image_url:
      selectedImageData,

    rating:
      Number(
        document.getElementById("rating").value || 0
      ),

    rating_count:
      Number(
        document.getElementById("ratingCount").value || 0
      ),

    stock:
      Number(
        document.getElementById("stock").value || 0
      )

  };


  if (
    !data.name ||
    !Number.isFinite(data.price)
  ) {

    alert(
      "Product name and price are required."
    );

    return;

  }


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: id ? "PUT" : "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify(
            id
              ? {
                  id: Number(id),
                  ...data
                }
              : data
          )
        }
      );


    const result =
      await response.json();


    if (response.status === 401) {

      alert(
        "Your admin session expired. Please log in again."
      );

      showLogin();

      return;

    }


    if (!response.ok) {

      throw new Error(
        result.error ||
        "Unable to save product."
      );

    }


    alert(
      id
        ? "Product updated."
        : "Product added."
    );


    clearForm();

    loadProducts();


  } catch (error) {

    alert(error.message);

  }

}


/* =========================
   DELETE
========================= */

async function deleteProduct(id) {

  const product =
    products.find(
      item =>
        Number(item.id) === Number(id)
    );


  if (!product) return;


  if (
    !confirm(
      `Delete "${product.name}"?`
    )
  ) {

    return;

  }


  try {

    const response =
      await fetch(
        API_URL +
        "?id=" +
        encodeURIComponent(id),
        {
          method: "DELETE",
          credentials: "same-origin"
        }
      );


    const result =
      await response.json();


    if (response.status === 401) {

      alert(
        "Your admin session expired. Please log in again."
      );

      showLogin();

      return;

    }


    if (!response.ok) {

      throw new Error(
        result.error ||
        "Unable to delete product."
      );

    }


    alert(
      "Product deleted."
    );


    loadProducts();


  } catch (error) {

    alert(error.message);

  }

}


checkSession();

</script>

</body>
  </html>
