<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechSpot PH</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}
header{padding:28px 7%;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:30px;font-weight:800}.blue{color:#1683ff}
button{background:#087ff5;color:#fff;border:0;border-radius:18px;padding:18px 25px;font-size:17px;font-weight:700}
.hero{padding:110px 7% 120px;min-height:620px;background:radial-gradient(circle at 70% 50%,#064aa8 0,#050505 48%)}
.tag{color:#1683ff;font-size:18px}.hero h1{font-size:clamp(42px,8vw,78px);max-width:850px;margin:18px 0;line-height:1.05}.hero p{font-size:22px;line-height:1.5;max-width:700px;color:#ddd}
section{padding:50px 7%}.products h2{font-size:38px}.muted{color:#aaa;font-size:18px}
.card{margin-top:30px;padding:30px;border:1px solid #222;border-radius:18px;background:#0d0d0d}
</style>
</head>
<body>
<header>
  <div class="logo">TECH<span class="blue">SPOT</span> PH</div>
  <button>MESSAGE US</button>
</header>
<main>
<section class="hero">
  <div class="tag">WELCOME TO TECHSPOT PH</div>
  <h1>YOUR ONE-STOP SHOP FOR ALL YOUR <span class="blue">TECH NEEDS.</span></h1>
  <p>iPhones, Android phones, laptops, computers and cameras. Quality checked and customer-focused service.</p>
</section>
<section class="products">
  <h2>AVAILABLE PRODUCTS</h2>
  <p class="muted">Connect the Cloudflare Worker API to load your live inventory.</p>
  <div class="card">No products loaded yet.</div>
</section>
</main>
</body>
</html>
