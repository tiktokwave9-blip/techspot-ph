<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TechSpot PH</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #050505;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  position: sticky;
  top: 0;
  z-index: 1000;
  padding: 16px 6%;
  background: rgba(5,5,5,.95);
  border-bottom: 1px solid #222;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.logo {
  font-size: 26px;
  font-weight: 800;
}

.blue {
  color: #1683ff;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

.message-btn {
  display: inline-block;
  background: #087ff5;
  color: #fff;
  padding: 12px 18px;
  border-radius: 11px;
  text-decoration: none;
  font-weight: 700;
  border: 0;
}

.message-btn:active {
  transform: scale(.97);
}

.hero {
  padding: 90px 6%;
  min-height: 540px;
  display: flex;
  align-items: center;
  background:
    radial-gradient(
      circle at 75% 45%,
      #064aa8 0,
      #07152a 25%,
      #050505 55%
    );
}

.hero-content {
  max-width: 900px;
}

.tag {
  color: #1683ff;
  font-size: 17px;
  font-weight: 700;
}

.hero h1 {
  font-size: clamp(40px, 8vw, 76px);
  line-height: 1.03;
  margin: 18px 0;
}

.hero p {
  max-width: 700px;
  color: #ccc;
  font-size: 19px;
  line-height: 1.6;
}

.hero-buttons {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 28px;
}

.secondary-btn {
  display: inline-block;
  background: #151515;
  border: 1px solid #333;
  color: #fff;
  padding: 12px 18px;
  border-radius: 11px;
  text-decoration: none;
  font-weight: 700;
}

section.products-section {
  padding: 55px 6%;
  max-width: 1400px;
  margin: auto;
}

.products-section h2 {
  font-size: 38px;
  margin: 0 0 8px;
}

.muted {
  color: #999;
  line-height: 1.5;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(
    auto-fill,
    minmax(220px, 1fr)
  );
  gap: 18px;
  margin-top: 30px;
}

.product {
  background: #0d0d0d;
  border: 1px solid #242424;
  border-radius: 17px;
  padding: 15px;
  cursor: pointer;
  transition: .2s;
}

.product:hover {
  border-color: #1683ff;
  transform: translateY(-3px);
}

.product-image {
  width: 100%;
  height: 210px;
  border-radius: 12px;
  background: #151515;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: #666;
  margin-bottom: 15px;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.product h3 {
  margin: 0 0 8px;
  font-size: 19px;
}

.price {
  color: #1683ff;
  font-size: 20px;
  font-weight: 800;
}

.rating {
  margin-top: 7px;
  color: #ffc107;
  font-size: 14px;
}

.stock {
  margin-top: 7px;
  color: #999;
  font-size: 14px;
}

.loading,
.error,
.empty {
  padding: 25px;
  margin-top: 25px;
  background: #0d0d0d;
  border: 1px solid #252525;
  border-radius: 15px;
  color: #aaa;
}

/* MODAL */

.modal {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 15px;
  background: rgba(0,0,0,.82);
}

.modal.show {
  display: flex;
}

.modal-box {
  width: min(520px, 100%);
  max-height: 92vh;
  overflow-y: auto;
  background: #0d1117;
  border: 1px solid #303b4a;
  border-radius: 20px;
  padding: 20px;
}

.close {
  float: right;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: #222;
  color: white;
  font-size: 27px;
  cursor: pointer;
}

.detail-image {
  width: 100%;
  height: 260px;
  margin-top: 5px;
  margin-bottom: 18px;
  border-radius: 15px;
  background: #151b22;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #666;
  overflow: hidden;
  clear: both;
}

.detail-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.modal-box h2 {
  margin: 0 0 8px;
  font-size: 25px;
}

.modal-price {
  color: #1683ff;
  font-size: 24px;
  font-weight: 800;
}

.modal-description {
  color: #bbb;
  line-height: 1.6;
  margin: 15px 0;
}

.modal-stock {
  color: #aaa;
  margin-bottom: 18px;
}

.modal-message {
  display: block;
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  background: #087ff5;
  color: #fff;
  text-align: center;
  text-decoration: none;
  font-weight: 800;
}

footer {
  padding: 35px 6%;
  border-top: 1px solid #222;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

/* MOBILE */

@media (max-width: 600px) {

  header {
    padding: 14px 5%;
  }

  .logo {
    font-size: 21px;
  }

  .message-btn {
    padding: 10px 12px;
    font-size: 12px;
  }

  .hero {
    padding: 65px 5% 75px;
  }

  .hero h1 {
    font-size: 43px;
  }

  .hero p {
    font-size: 17px;
  }

  section.products-section {
    padding: 40px 5%;
  }

  .products-section h2 {
    font-size: 30px;
  }

  .product-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .product {
    padding: 10px;
  }

  .product-image {
    height: 145px;
  }

  .product h3 {
    font-size: 15px;
  }

  .price {
    font-size: 17px;
  }

  .detail-image {
    height: 220px;
  }

  footer {
    flex-direction: column;
    text-align: center;
  }
}
</style>
</head>
