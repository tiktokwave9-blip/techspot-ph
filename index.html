<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TechSpot PH</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050505;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px 7%;
  border-bottom: 1px solid #222;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 30px;
  font-weight: 800;
}

.blue {
  color: #1683ff;
}

.message-btn,
.modal-message {
  display: inline-block;
  background: #087ff5;
  color: white;
  padding: 13px 20px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 700;
  border: 0;
  cursor: pointer;
}

.hero {
  padding: 90px 7% 100px;
  min-height: 560px;
  background: radial-gradient(
    circle at 70% 50%,
    #064aa8 0,
    #050505 48%
  );
}

.tag {
  color: #1683ff;
  font-size: 18px;
  font-weight: 700;
}

.hero h1 {
  font-size: clamp(42px, 8vw, 78px);
  max-width: 850px;
  margin: 18px 0;
  line-height: 1.05;
}

.hero p {
  font-size: 21px;
  line-height: 1.5;
  max-width: 700px;
  color: #ddd;
}

section {
  padding: 50px 7%;
}

.products h2 {
  font-size: 38px;
  margin-bottom: 10px;
}

.muted {
  color: #aaa;
  font-size: 18px;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-top: 30px;
}

.product {
  background: #0d0d0d;
  border: 1px solid #252525;
  border-radius: 18px;
  padding: 18px;
  cursor: pointer;
  transition: .2s;
}

.product:hover {
  border-color: #1683ff;
  transform: translateY(-3px);
}

.product-image {
  width: 100%;
  height: 190px;
  border-radius: 12px;
  background: #151515;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #777;
  margin-bottom: 18px;
  overflow: hidden;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.product h3 {
  margin: 0 0 8px;
  font-size: 21px;
}

.price {
  color: #1683ff;
  font-size: 20px;
  font-weight: 700;
}

.stock {
  margin-top: 8px;
  color: #aaa;
  font-size: 14px;
}

.rating {
  margin-top: 8px;
  color: #ffc107;
}

.loading,
.error,
.empty {
  margin-top: 30px;
  padding: 25px;
  border: 1px solid #252525;
  border-radius: 18px;
  background: #0d0d0d;
  color: #bbb;
}

/* MODALS */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .78);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 9999;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: min(500px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: #0d1117;
  border: 1px solid #303b4a;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
}

.close {
  float: right;
  background: transparent;
  border: 0;
  color: #fff;
  font-size: 30px;
  cursor: pointer;
}

.detail-image {
  height: 230px;
  background: #151b22;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #777;
  margin-bottom: 20px;
  overflow: hidden;
  clear: both;
}

.detail-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.modal-box h2 {
  margin: 0 0 8px;
}

.modal-price {
  color: #1683ff;
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 12px;
}

.modal-description {
  color: #bbb;
  line-height: 1.5;
  margin-bottom: 15px;
}

.modal-stock {
  color: #aaa;
  margin-bottom: 20px;
}

/* MESSAGE FORM */

.message-form {
  display: none;
}

.message-form.show {
  display: block;
}

.message-form label {
  display: block;
  color: #aaa;
  margin: 15px 0 7px;
}

.message-form input,
.message-form textarea {
  width: 100%;
  background: #080808;
  border: 1px solid #333;
  color: white;
  border-radius: 10px;
  padding: 13px;
  font-size: 16px;
  outline: none;
}

.message-form textarea {
  min-height: 120px;
  resize: vertical;
}

.send-button {
  width: 100%;
  margin-top: 15px;
  background: #087ff5;
  color: white;
  border: 0;
  padding: 14px;
  border-radius: 12px;
  font-weight: 700;
  cursor: pointer;
  font-size: 16px;
}

.cancel-button {
  width: 100%;
  margin-top: 8px;
  background: #222;
  color: white;
  border: 0;
  padding: 12px;
  border-radius: 12px;
  cursor: pointer;
}

.message-status {
  margin-top: 12px;
  color: #aaa;
  text-align: center;
}

footer {
  padding: 35px 7%;
  border-top: 1px solid #222;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

@media (max-width: 600px) {

  header {
    padding: 18px 5%;
  }

  .logo {
    font-size: 23px;
  }

  .message-btn {
    padding: 10px 13px;
    font-size: 13px;
  }

  .hero {
    padding: 70px 5% 80px;
  }

  section {
    padding: 40px 5%;
  }

  .product-grid {
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .product {
    padding: 12px;
  }

  .product-image {
    height: 140px;
  }

  .product h3 {
    font-size: 16px;
  }

  .price {
    font-size: 17px;
  }

  footer {
    padding: 25px 5%;
    flex-direction: column;
    text-align: center;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    TECH<span class="blue">SPOT</span> PH
  </div>

  <button
    class="message-btn"
    type="button"
    onclick="openMessageBox()"
  >
    💬 MESSAGE US
  </button>

</header>

<main>

<section class="hero">

  <div class="tag">
    WELCOME TO TECHSPOT PH
  </div>

  <h1>
    YOUR ONE-STOP SHOP FOR ALL YOUR
